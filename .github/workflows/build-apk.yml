name: Build Sky Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK (arm64-v8a)
        uses: android-actions/setup-android@v3

      - name: Install NDK r27 & CMake 3.22.1
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest

      - name: Assemble Debug APK (with Native C++/JNI Enabled)
        run: gradle :app:assembleDebug -PenableNativeBuild=true

      - name: Upload Sky Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sky-assistant-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
